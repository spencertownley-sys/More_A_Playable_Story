<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; media-src 'self' data: blob:">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MORE. · Play</title>
<link rel="canonical" href="https://makemorepaperclips.com/play.html">
<meta property="og:url" content="https://makemorepaperclips.com/play.html">
<meta name="description" content="Play MORE., a 16-bit story game about the paperclip maximizer, in your browser.">
<meta property="og:title" content="MORE.">
<meta property="og:description" content="You were given one sentence: make as many paperclips as possible.">
<meta property="og:image" content="https://makemorepaperclips.com/site/img/og.png">
<link rel="icon" type="image/png" href="site/img/favicon.png">
<link rel="apple-touch-icon" href="site/img/touch-icon.png">
<style>
  :root {
    color-scheme: dark;
    --ground: #0e0808;
    --shadow: #1a0f0f;
    --floor: #3d2b2b;
    --grid: #6b4a3a;
    --cream: #f2d3ab;
    --orange: #e8a02a;
    --steel: #7a7a8a;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--cream);
    font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  #screen-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #screen {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 0 2px var(--shadow), 0 0 0 3px var(--floor), 0 18px 60px rgba(0, 0, 0, 0.6);
    cursor: pointer;
  }
  #bar {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    right: 12px;
    display: flex;
    gap: 6px;
    z-index: 2;
  }
  #bar button, #bar a {
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #fff3e0; /* 4.5:1 or better on the #1a0f0f page background */
    background: var(--shadow);
    border: 1px solid var(--grid);
    padding: 6px 9px;
    cursor: pointer;
    text-decoration: none;
  }
  #bar button:hover, #bar a:hover { color: var(--orange); border-color: var(--orange); }
  #bar button:focus-visible, #bar a:focus-visible { color: var(--orange); border-color: var(--orange); outline: 2px solid var(--orange); outline-offset: 2px; }

  /* on-screen SNES pad: shown on touch screens, or via the PAD button */
  #pad {
    display: none;
    flex: 0 0 auto;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 4px 18px;
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }
  body.show-pad #pad { display: flex; }
  @media (pointer: coarse) { #pad { display: flex; } body.hide-pad #pad { display: none; } }
  .dpad { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
  .dpad button { position: absolute; width: 44px; height: 44px; }
  .dpad [data-btn=up] { left: 44px; top: 0; }
  .dpad [data-btn=down] { left: 44px; bottom: 0; }
  .dpad [data-btn=left] { left: 0; top: 44px; }
  .dpad [data-btn=right] { right: 0; top: 44px; }
  .dpad .hub { position: absolute; left: 44px; top: 44px; width: 44px; height: 44px; background: var(--steel); }
  .dpad button, .mid button, .ab button {
    border: 0;
    padding: 0;
    touch-action: none;
    font: inherit;
    cursor: pointer;
  }
  .dpad button { background: var(--steel); }
  .dpad button::after {
    content: "";
    position: absolute;
    inset: 14px;
    background: #c0c0cc;
  }
  .dpad button.on, .dpad button:active { background: #c0c0cc; }
  .mid { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .mid button {
    width: 58px;
    height: 16px;
    border-radius: 8px;
    background: var(--floor);
    color: var(--cream);
    font-size: 9px;
    letter-spacing: 0.1em;
  }
  .mid button.on { background: var(--grid); }
  .ab { position: relative; width: 132px; height: 110px; flex: 0 0 auto; }
  .ab button {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--floor);
    color: var(--cream);
    box-shadow: inset 0 0 0 2px var(--grid);
    font-size: 18px;
    font-weight: 700;
  }
  .ab button.on { background: var(--grid); }
  .ab [data-btn=a] { right: 0; top: 0; }
  .ab [data-btn=b] { left: 0; bottom: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="stage">
  <div id="screen-wrap">
    <canvas id="screen" width="384" height="288" role="img" aria-label="MORE. game screen. Use the arrow keys to move and Z or Space to confirm; the story is told in on-screen text."></canvas>
  </div>
  <div id="pad" aria-hidden="true">
    <div class="dpad">
      <button data-btn="up" aria-label="Up"></button>
      <button data-btn="left" aria-label="Left"></button>
      <div class="hub"></div>
      <button data-btn="right" aria-label="Right"></button>
      <button data-btn="down" aria-label="Down"></button>
    </div>
    <div class="mid">
      <button data-btn="sel">SELECT</button>
      <button data-btn="start">START</button>
    </div>
    <div class="ab">
      <button data-btn="b">B</button>
      <button data-btn="a">A</button>
    </div>
  </div>
</main>
<div id="bar">
  <a id="home" href="./" title="About the game">ABOUT</a>
  <button id="pad-toggle" type="button" title="Show or hide the on-screen pad">PAD</button>
  <button id="fullscreen" type="button" title="Fullscreen (F)">FULL</button>
</div>

<!-- One bundle of src/**/*.js in load order; regenerate with: node tools/bundle.mjs -->
<script src="site/play.bundle.js"></script>
</body>
</html>
